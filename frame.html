<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobile preview</title>
<style>
:root{--vsw:47px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0d100e;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column}

.vswitch{position:sticky;top:0;z-index:200;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:nowrap;overflow-x:auto;height:var(--vsw);padding:0 10px;background:#0d100e;border-bottom:1px solid #232a26;scrollbar-width:none;flex:none}
.vswitch::-webkit-scrollbar{display:none}
.vswitch a{display:flex;align-items:center;gap:8px;padding:4px 11px 4px 4px;border-radius:8px;background:#171c19;border:1px solid #2b322e;text-decoration:none;color:#93a197;transition:.14s ease;flex:none}
.vswitch a:hover{color:#fff;border-color:#46C083}
.vswitch a.on{background:#12301f;border-color:#0A7D46;color:#d6f2e2}
.vswitch .sq{width:24px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:#252c28;color:#b9c6bd;flex:none}
.vswitch a.on .sq{background:#0A7D46;color:#fff}
.vswitch .sq svg{width:14px;height:14px}
.vswitch .lb{font-size:12px;font-weight:500;white-space:nowrap}
.vswitch .div{width:1px;height:26px;background:#2b322e;flex:none;margin:0 3px}
.vswitch a:focus-visible{outline:2px solid #46C083;outline-offset:2px}
@media(max-width:520px){.vswitch .lb{display:none}.vswitch a{padding:4px}}

.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;padding:22px 14px 26px;overflow:auto}
.phone{
  width:393px;max-width:100%;height:852px;
  min-height:560px;max-height:calc(100vh - var(--vsw) - 96px);
  background:#000;border:10px solid #1b211d;border-radius:34px;
  box-shadow:0 18px 50px -14px rgba(0,0,0,.75);
  overflow:hidden;flex:none;position:relative;
}
.phone{box-sizing:content-box;display:flex;flex-direction:column;height:calc(852px + 130px)}
.phone iframe{width:100%;flex:1 1 auto;min-height:0;border:0;display:block;background:#fff}
.sbar{flex:none;height:42px;background:#000;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 26px;font-size:16px;font-weight:600;letter-spacing:.01em}
.sbar .ico{display:flex;align-items:center;gap:7px}
.sbar svg{height:15px;width:auto;display:block}
.sbar .bat{display:flex;align-items:center;gap:3px;font-size:11px;font-weight:700;background:#d9d9d9;color:#111;border-radius:6px;padding:1px 6px;line-height:14px}
.cbar{flex:none;height:64px;background:#1b1b1b;display:flex;align-items:center;gap:14px;padding:0 16px}
.cbar .home{width:26px;height:26px;color:#f1f1f1;flex:none}
.cbar .pill{flex:1 1 auto;min-width:0;height:44px;background:#303134;border-radius:22px;display:flex;align-items:center;gap:10px;padding:0 14px;color:#e8eaed;font-size:17px}
.cbar .pill .tune{width:18px;height:18px;flex:none;color:#bdc1c6}
.cbar .pill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbar .plus{width:26px;height:26px;color:#f1f1f1;flex:none}
.cbar .tabs{width:28px;height:28px;border:2.5px solid #f1f1f1;border-radius:6px;color:#f1f1f1;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;line-height:1}
.cbar .more{width:22px;height:22px;color:#f1f1f1;flex:none}
.gbar{flex:none;height:24px;background:#fff;display:flex;align-items:center;justify-content:center}
.gbar i{display:block;width:120px;height:4px;border-radius:2px;background:#c4c4c4}
.meta{color:#78857c;font-size:11.5px;font-family:ui-monospace,"Cascadia Mono",monospace;letter-spacing:.04em}
.fsbtn{margin-left:6px;display:flex;align-items:center;gap:8px;padding:4px 11px 4px 4px;border-radius:8px;background:#0A7D46;border:1px solid #0A7D46;color:#fff;font:inherit;font-size:12px;font-weight:600;cursor:pointer;flex:none}
.fsbtn .sq{background:#0b5f37;color:#fff}
.fsbtn:hover{background:#0c9354}
body.fs{background:#000;overflow:hidden}
body.fs .vswitch,body.fs .meta{display:none}
body.fs .stage{padding:0;gap:0;justify-content:center;align-items:center;overflow:hidden;height:100vh}
body.fs .phone{border:0;border-radius:0;box-shadow:none;max-height:none;transform-origin:center center}
body.fs .fsexit{display:flex}
.fsexit{display:none;position:fixed;top:12px;right:12px;z-index:300;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.25);align-items:center;justify-content:center;cursor:pointer;font-size:18px;line-height:1}
</style>
</head>
<body>

<nav class="vswitch" id="sw" aria-label="Design version and device"></nav>

<button class="fsexit" id="fsexit" type="button" title="Exit full screen" aria-label="Exit full screen">&#x2715;</button>
<div class="stage">
<div class="phone">
    <div class="sbar" aria-hidden="true">
      <span id="clock">18:56</span>
      <span class="ico">
        <svg viewBox="0 0 22 16" fill="#fff"><path d="M11 13.2 8.2 10.4a4 4 0 0 1 5.6 0L11 13.2Zm0-6.4a7 7 0 0 0-5 2.1L4.2 7.1A9.6 9.6 0 0 1 11 4.3c2.6 0 5 1 6.8 2.8L16 8.9A7 7 0 0 0 11 6.8ZM11 2a12 12 0 0 0-8.5 3.5L.7 3.7A14.6 14.6 0 0 1 11 0c4 0 7.6 1.4 10.3 3.7l-1.8 1.8A12 12 0 0 0 11 2Z"/></svg>
        <svg viewBox="0 0 18 16" fill="#fff"><rect x="0" y="10" width="3" height="6" rx=".6"/><rect x="5" y="7" width="3" height="9" rx=".6"/><rect x="10" y="4" width="3" height="12" rx=".6"/><rect x="15" y="0" width="3" height="16" rx=".6"/></svg>
        <span class="bat">54</span>
      </span>
    </div>
    <div class="cbar" aria-hidden="true">
      <svg class="home" viewBox="0 0 24 24" fill="none"><path d="M3.5 11 12 3.5l8.5 7.5V20a1 1 0 0 1-1 1h-5v-6h-5v6h-5a1 1 0 0 1-1-1v-9Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <div class="pill">
        <svg class="tune" viewBox="0 0 24 24" fill="none"><path d="M3 7h9M16 7h5M3 17h5M12 17h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="14" cy="7" r="2.2" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="17" r="2.2" stroke="currentColor" stroke-width="2"/></svg>
        <span id="addr">rishav52.github.io</span>
      </div>
      <svg class="plus" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      <div class="tabs">17</div>
      <svg class="more" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="12" cy="19" r="2.2"/></svg>
    </div>
    <iframe id="fr" title="Mobile preview"></iframe>
    <div class="gbar" aria-hidden="true"><i></i></div>
  </div>
  <div class="meta" id="meta"></div>
</div>

<script>
var BASE = "/Share-Page-GroMo/";
var VERSIONS = [
  { n:"1", label:"Original",  path:"" },
  { n:"2", label:"Catalogue", path:"v2/" },
  { n:"3", label:"Clean hero", path:"v3/" }
];
var MON = '<svg viewBox="0 0 24 24" fill="none"><rect x="2.5" y="4" width="19" height="13" rx="2" stroke="currentColor" stroke-width="2"/><path d="M9 21h6M12 17v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
var PHN = '<svg viewBox="0 0 24 24" fill="none"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5" stroke="currentColor" stroke-width="2"/><path d="M10.5 18.5h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

var v = new URLSearchParams(location.search).get("v") || "1";
var cur = VERSIONS.filter(function(x){ return x.n === v; })[0] || VERSIONS[0];

var html = "";
VERSIONS.forEach(function(x){
  html += '<a class="' + (x.n === cur.n ? "on" : "") + '" href="' + BASE + "frame.html?v=" + x.n +
          '" title="Version ' + x.n + ' - ' + x.label + '">' +
          '<span class="sq">' + x.n + '</span><span class="lb">' + x.label + "</span></a>";
});
html += '<span class="div"></span>';
html += '<a href="' + BASE + cur.path + '" title="Desktop view">' +
        '<span class="sq">' + MON + '</span><span class="lb">Desktop</span></a>';
html += '<a class="on" href="' + BASE + "frame.html?v=" + cur.n + '" title="Mobile view">' +
        '<span class="sq">' + PHN + '</span><span class="lb">Mobile</span></a>';
html += '<button class="fsbtn" id="fsbtn" type="button" title="Open full-screen phone view"><span class="sq">' + PHN + '</span><span class="lb">Full screen</span></button>';
document.getElementById("sw").innerHTML = html;

var PHONE_W = 393, PHONE_H = 852 + 130;
function fitPhone(){
  var ph = document.querySelector(".phone");
  if(!document.body.classList.contains("fs")){ ph.style.transform = ""; ph.style.height = ""; return; }
  var s = Math.min(1, window.innerWidth / PHONE_W);
  var h = Math.min(PHONE_H, Math.floor(window.innerHeight / s));
  ph.style.transform = "scale(" + s + ")";
  ph.style.height = h + "px";
}
function enterFs(){
  document.body.classList.add("fs");
  fitPhone();
  var el = document.documentElement;
  var req = el.requestFullscreen || el.webkitRequestFullscreen;
  if(req && !document.fullscreenElement){ try { req.call(el); } catch(e){} }
}
function exitFs(){
  document.body.classList.remove("fs");
  fitPhone();
  if(document.fullscreenElement && document.exitFullscreen){ document.exitFullscreen(); }
}
document.getElementById("fsbtn").addEventListener("click", enterFs);
document.getElementById("fsexit").addEventListener("click", exitFs);
document.addEventListener("fullscreenchange", function(){ if(!document.fullscreenElement) exitFs(); });
document.addEventListener("keydown", function(e){ if(e.key === "Escape") exitFs(); });
window.addEventListener("resize", fitPhone);
if(new URLSearchParams(location.search).get("fs") === "1"){ document.body.classList.add("fs"); fitPhone(); }

document.getElementById("fr").src = BASE + cur.path + "?embed=1";
document.getElementById("addr").textContent = "rishav52.github.io" + BASE + cur.path;
(function tick(){ var t=new Date(); document.getElementById("clock").textContent = String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0"); setTimeout(tick, 15000); })();
document.getElementById("meta").textContent = "V" + cur.n + " · " + cur.label + " · 393 × 852";
document.title = "V" + cur.n + " " + cur.label + " - mobile preview";
</script>
</body>
</html>
