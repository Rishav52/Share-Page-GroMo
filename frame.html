<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobile preview</title>
<style>
:root{--vsw:47px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0d100e;font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column}

.vswitch{position:sticky;top:0;z-index:200;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:nowrap;overflow-x:auto;height:var(--vsw);padding:0 10px;background:#0d100e;border-bottom:1px solid #232a26;scrollbar-width:none;flex:none}
.vswitch::-webkit-scrollbar{display:none}
.vswitch a{display:flex;align-items:center;gap:8px;padding:4px 11px 4px 4px;border-radius:8px;background:#171c19;border:1px solid #2b322e;text-decoration:none;color:#93a197;transition:.14s ease;flex:none}
.vswitch a:hover{color:#fff;border-color:#46C083}
.vswitch a.on{background:#12301f;border-color:#0A7D46;color:#d6f2e2}
.vswitch .sq{width:24px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:#252c28;color:#b9c6bd;flex:none}
.vswitch a.on .sq{background:#0A7D46;color:#fff}
.vswitch .sq svg{width:14px;height:14px}
.vswitch .lb{font-size:12px;font-weight:500;white-space:nowrap}
.vswitch .div{width:1px;height:26px;background:#2b322e;flex:none;margin:0 3px}
.vswitch a:focus-visible{outline:2px solid #46C083;outline-offset:2px}
@media(max-width:520px){.vswitch .lb{display:none}.vswitch a{padding:4px}}

.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;padding:22px 14px 26px;overflow:auto}
.phone{
  width:390px;max-width:100%;height:844px;
  min-height:560px;max-height:calc(100vh - var(--vsw) - 96px);
  background:#000;border:10px solid #1b211d;border-radius:34px;
  box-shadow:0 18px 50px -14px rgba(0,0,0,.75);
  overflow:hidden;flex:none;position:relative;
}
.phone iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.meta{color:#78857c;font-size:11.5px;font-family:ui-monospace,"Cascadia Mono",monospace;letter-spacing:.04em}
</style>
</head>
<body>

<nav class="vswitch" id="sw" aria-label="Design version and device"></nav>

<div class="stage">
  <div class="phone"><iframe id="fr" title="Mobile preview"></iframe></div>
  <div class="meta" id="meta"></div>
</div>

<script>
var BASE = "/Share-Page-GroMo/";
var VERSIONS = [
  { n:"1", label:"Original",  path:"" },
  { n:"2", label:"Catalogue", path:"v2/" }
];
var MON = '<svg viewBox="0 0 24 24" fill="none"><rect x="2.5" y="4" width="19" height="13" rx="2" stroke="currentColor" stroke-width="2"/><path d="M9 21h6M12 17v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
var PHN = '<svg viewBox="0 0 24 24" fill="none"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5" stroke="currentColor" stroke-width="2"/><path d="M10.5 18.5h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

var v = new URLSearchParams(location.search).get("v") || "1";
var cur = VERSIONS.filter(function(x){ return x.n === v; })[0] || VERSIONS[0];

var html = "";
VERSIONS.forEach(function(x){
  html += '<a class="' + (x.n === cur.n ? "on" : "") + '" href="' + BASE + "frame.html?v=" + x.n +
          '" title="Version ' + x.n + ' - ' + x.label + '">' +
          '<span class="sq">' + x.n + '</span><span class="lb">' + x.label + "</span></a>";
});
html += '<span class="div"></span>';
html += '<a href="' + BASE + cur.path + '" title="Desktop view">' +
        '<span class="sq">' + MON + '</span><span class="lb">Desktop</span></a>';
html += '<a class="on" href="' + BASE + "frame.html?v=" + cur.n + '" title="Mobile view">' +
        '<span class="sq">' + PHN + '</span><span class="lb">Mobile</span></a>';
document.getElementById("sw").innerHTML = html;

document.getElementById("fr").src = BASE + cur.path + "?embed=1";
document.getElementById("meta").textContent = "V" + cur.n + " · " + cur.label + " · 390 × 844";
document.title = "V" + cur.n + " " + cur.label + " - mobile preview";
</script>
</body>
</html>
